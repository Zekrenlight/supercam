[package]
name = "mod-supercam"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "SuperCam for Sunrise: a smooth zoom, a free camera and lively camera motion."
authors = ["Zekrenlight"]

[lib]
name = "mod_supercam"
path = "src/lib.rs"

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
